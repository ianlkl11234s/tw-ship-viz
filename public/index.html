<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣海域船舶密度熱區圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            overflow: hidden;
        }

        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 地圖縮放控制移至右上方 */
        .leaflet-top.leaflet-left {
            left: auto;
            right: 10px;
        }

        /* 左上方狀態面板 */
        .status-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .status-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .time-display {
            font-size: 28px;
            font-weight: 700;
            color: #0077b6;
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
        }

        .stats-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
            color: #666;
        }

        .stats-row .stat-item {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }

        .stats-value {
            color: #333;
            font-weight: 600;
        }

        /* 船種篩選（整合在狀態面板內） */
        .filter-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-title {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .filter-select {
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px 12px;
            color: #333;
            font-size: 14px;
            cursor: pointer;
        }

        .filter-select:focus {
            outline: none;
            border-color: #0077b6;
        }

        .filter-select option {
            background: #fff;
            color: #333;
        }

        /* 底部時間軸控制 */
        .timeline-panel {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 16px 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 500px;
        }

        .play-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #0077b6, #00a8e8);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(0, 119, 182, 0.4);
        }

        .timeline-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timeline {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
        }

        .timeline::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #0077b6;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 119, 182, 0.5);
        }

        .timeline::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #0077b6;
            cursor: pointer;
            border: none;
        }

        .speed-controls {
            display: flex;
            gap: 6px;
        }

        .speed-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid #ddd;
            background: transparent;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .speed-btn:hover, .speed-btn.active {
            background: rgba(0, 119, 182, 0.1);
            border-color: #0077b6;
            color: #0077b6;
        }

        /* 圖例 */
        .legend {
            position: fixed;
            bottom: 110px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .legend-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
        }

        .legend-color {
            width: 22px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.1);
        }

        /* 載入中 */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 119, 182, 0.2);
            border-top-color: #0077b6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 資訊面板 */
        .info-panel {
            position: fixed;
            bottom: 110px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 12px 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            font-size: 11px;
            color: #888;
        }

        .info-panel a {
            color: #0077b6;
            text-decoration: none;
        }

        .info-panel a:hover {
            text-decoration: underline;
        }

        /* 響應式設計 */
        @media (max-width: 700px) {
            .status-panel {
                top: 10px;
                left: 10px;
                padding: 12px 14px;
            }

            .status-title {
                font-size: 14px;
            }

            .time-display {
                font-size: 22px;
            }

            .timeline-panel {
                min-width: auto;
                width: calc(100% - 20px);
                padding: 12px 16px;
                gap: 10px;
            }

            .play-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .speed-btn {
                padding: 6px 10px;
                font-size: 12px;
            }

            .legend {
                bottom: 180px;
                right: 10px;
                padding: 10px 12px;
            }

            .info-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 載入中 -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">載入船舶密度資料中...</div>
    </div>

    <!-- 地圖 -->
    <div id="map"></div>

    <!-- 左上方狀態面板 -->
    <div class="status-panel">
        <div class="status-title">🚢 台灣海域船舶密度</div>
        <div class="time-display" id="timeDisplay">--</div>
        <div class="stats-row">
            <div class="stat-item">
                <span>範圍內船舶</span>
                <span class="stats-value" id="shipCount">--</span>
            </div>
            <div class="stat-item">
                <span>最高密度</span>
                <span class="stats-value" id="maxDensity">--</span>
            </div>
        </div>
        <!-- 船種篩選 -->
        <div class="filter-section">
            <div class="filter-title">船舶類型</div>
            <select class="filter-select" id="vesselFilter">
                <option value="all">所有船舶</option>
                <option value="cargo">貨船</option>
                <option value="tanker">油輪</option>
                <option value="passenger">客輪</option>
                <option value="fishing">漁船</option>
                <option value="tug">拖船</option>
                <option value="military">軍艦</option>
                <option value="sailing">帆船/遊艇</option>
                <option value="highspeed">高速船</option>
                <option value="service">服務船舶</option>
            </select>
        </div>
    </div>

    <!-- 底部時間軸控制 -->
    <div class="timeline-panel">
        <button class="play-btn" id="playBtn">▶</button>
        <div class="timeline-container">
            <input type="range" class="timeline" id="timeline" min="0" max="100" value="0">
        </div>
        <div class="speed-controls">
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="2">2x</button>
            <button class="speed-btn" data-speed="4">4x</button>
            <button class="speed-btn" data-speed="8">8x</button>
        </div>
    </div>

    <!-- 圖例 -->
    <div class="legend">
        <div class="legend-title">船舶密度（艘/格）</div>
        <div class="legend-items">
            <div class="legend-item">
                <div class="legend-color" style="background: #03045e;"></div>
                <span>> 50</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #023e8a;"></div>
                <span>21 - 50</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #0077b6;"></div>
                <span>11 - 20</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #0096c7;"></div>
                <span>6 - 10</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #7ec8e3;"></div>
                <span>3 - 5</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #b3d9e8;"></div>
                <span>1 - 2</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #e8f4f8;"></div>
                <span>0（海域）</span>
            </div>
        </div>
    </div>

    <!-- 資訊面板 -->
    <div class="info-panel">
        <p>資料來源：航港局 AIS</p>
        <p>格網：0.1° (~11km)</p>
        <p style="margin-top: 8px;"><a href="trajectory.html">軌跡動畫 →</a></p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 全域變數
        let map;
        let densityData = null;
        let currentFrame = 0;
        let currentFilter = 'all';
        let isPlaying = false;
        let playSpeed = 1;
        let playInterval = null;
        let gridLayer = null;

        // 船種類別定義
        const VESSEL_CATEGORIES = {
            all: null,  // 不篩選
            fishing: [30],
            cargo: [70,71,72,73,74,75,76,77,78,79],
            tanker: [80,81,82,83,84,85,86,87,88,89],
            passenger: [60,61,62,63,64,65,66,67,68,69],
            tug: [31, 32],
            military: [35],
            sailing: [36, 37],
            service: [50, 51, 52, 53, 55, 33, 34],
            highspeed: [40]
        };

        // DOM 元素
        const loadingEl = document.getElementById('loading');
        const timeDisplayEl = document.getElementById('timeDisplay');
        const shipCountEl = document.getElementById('shipCount');
        const maxDensityEl = document.getElementById('maxDensity');
        const playBtnEl = document.getElementById('playBtn');
        const timelineEl = document.getElementById('timeline');
        const speedBtns = document.querySelectorAll('.speed-btn');
        const vesselFilterEl = document.getElementById('vesselFilter');

        // 色彩映射（藍色系漸層）
        function getDensityColor(count) {
            if (count === 0) return '#e8f4f8';  // 淡淡的海洋底色
            if (count <= 2) return '#b3d9e8';   // 淺藍
            if (count <= 5) return '#7ec8e3';   // 天藍
            if (count <= 10) return '#0096c7';  // 藍色
            if (count <= 20) return '#0077b6';  // 深藍
            if (count <= 50) return '#023e8a';  // 海軍藍
            return '#03045e';                    // 深海藍
        }

        function getDensityOpacity(count) {
            if (count === 0) return 0.3;  // 空白區域也有淡淡底色
            if (count <= 2) return 0.6;
            if (count <= 5) return 0.7;
            if (count <= 10) return 0.75;
            if (count <= 20) return 0.8;
            if (count <= 50) return 0.85;
            return 0.9;
        }

        // 初始化地圖
        function initMap() {
            map = L.map('map', {
                center: [24.5, 121.5],
                zoom: 7,
                minZoom: 5,
                maxZoom: 12,
                zoomControl: false
            });

            L.control.zoom({
                position: 'topright'
            }).addTo(map);

            // 淺色底圖
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            gridLayer = L.layerGroup().addTo(map);
        }

        // 網格放大倍數（2 = 0.1°，原本是 0.05°）
        const GRID_SCALE = 2;

        // 計算密度格網（即時篩選，支援放大網格）
        function calculateDensityGrid(ships, geoInfo, filter) {
            const { bottom_left_lon, bottom_left_lat, resolution_lon, resolution_lat, cols, rows } = geoInfo;
            const validTypes = VESSEL_CATEGORIES[filter];

            // 放大後的格網尺寸
            const scaledCols = Math.ceil(cols / GRID_SCALE);
            const scaledRows = Math.ceil(rows / GRID_SCALE);
            const scaledResLon = resolution_lon * GRID_SCALE;
            const scaledResLat = resolution_lat * GRID_SCALE;

            // 初始化格網
            const grid = [];
            for (let r = 0; r < scaledRows; r++) {
                grid.push(new Array(scaledCols).fill(0));
            }

            let shipCount = 0;
            let maxDensity = 0;

            // 計算密度
            for (const ship of ships) {
                const [lon, lat, vtype] = ship;

                // 船種篩選
                if (validTypes && !validTypes.includes(vtype)) {
                    continue;
                }

                // 檢查是否在範圍內
                if (lon < bottom_left_lon || lon >= bottom_left_lon + scaledCols * scaledResLon) continue;
                if (lat < bottom_left_lat || lat >= bottom_left_lat + scaledRows * scaledResLat) continue;

                const col = Math.floor((lon - bottom_left_lon) / scaledResLon);
                const row = Math.floor((lat - bottom_left_lat) / scaledResLat);

                if (col >= 0 && col < scaledCols && row >= 0 && row < scaledRows) {
                    grid[row][col]++;
                    shipCount++;
                    maxDensity = Math.max(maxDensity, grid[row][col]);
                }
            }

            return {
                grid,
                shipCount,
                maxDensity,
                resolution: scaledResLon,
                cols: scaledCols,
                rows: scaledRows
            };
        }

        // 繪製密度格網
        function renderFrame(frameIndex) {
            if (!densityData || frameIndex < 0 || frameIndex >= densityData.frames.length) {
                return;
            }

            const frame = densityData.frames[frameIndex];
            const geoInfo = densityData.metadata.geo_info;

            // 計算密度格網
            const result = calculateDensityGrid(
                frame.ships,
                geoInfo,
                currentFilter
            );

            // 更新 UI
            timeDisplayEl.textContent = frame.time;
            shipCountEl.textContent = result.shipCount.toLocaleString();
            maxDensityEl.textContent = result.maxDensity;
            timelineEl.value = frameIndex;

            // 清除現有格網
            gridLayer.clearLayers();

            // 繪製新格網（包含空白區域的淡底色）
            const resolution = result.resolution;

            for (let row = 0; row < result.grid.length; row++) {
                for (let col = 0; col < result.grid[row].length; col++) {
                    const count = result.grid[row][col];

                    const lat1 = geoInfo.bottom_left_lat + row * resolution;
                    const lat2 = lat1 + resolution;
                    const lon1 = geoInfo.bottom_left_lon + col * resolution;
                    const lon2 = lon1 + resolution;

                    const color = getDensityColor(count);
                    const opacity = getDensityOpacity(count);

                    const rect = L.rectangle(
                        [[lat1, lon1], [lat2, lon2]],
                        {
                            color: 'transparent',
                            weight: 0,
                            fillColor: color,
                            fillOpacity: opacity
                        }
                    );

                    if (count > 0) {
                        rect.bindPopup(`
                            <strong>船舶數量：${count}</strong><br>
                            經度：${lon1.toFixed(2)}° - ${lon2.toFixed(2)}°<br>
                            緯度：${lat1.toFixed(2)}° - ${lat2.toFixed(2)}°
                        `);
                    }

                    gridLayer.addLayer(rect);
                }
            }

            currentFrame = frameIndex;
        }

        // 播放控制
        function togglePlay() {
            if (isPlaying) {
                stopPlay();
            } else {
                startPlay();
            }
        }

        function startPlay() {
            isPlaying = true;
            playBtnEl.textContent = '⏸';

            const interval = 1000 / playSpeed;
            playInterval = setInterval(() => {
                let nextFrame = currentFrame + 1;
                if (nextFrame >= densityData.frames.length) {
                    nextFrame = 0;
                }
                renderFrame(nextFrame);
            }, interval);
        }

        function stopPlay() {
            isPlaying = false;
            playBtnEl.textContent = '▶';
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
        }

        function setSpeed(speed) {
            playSpeed = speed;
            speedBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.speed) === speed);
            });

            if (isPlaying) {
                stopPlay();
                startPlay();
            }
        }

        // 事件綁定
        function setupEventListeners() {
            playBtnEl.addEventListener('click', togglePlay);

            timelineEl.addEventListener('input', (e) => {
                const frameIndex = parseInt(e.target.value);
                renderFrame(frameIndex);
            });

            speedBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    setSpeed(parseInt(btn.dataset.speed));
                });
            });

            // 船種篩選（即時切換）
            vesselFilterEl.addEventListener('change', () => {
                currentFilter = vesselFilterEl.value;
                renderFrame(currentFrame);
            });

            // 鍵盤控制
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowLeft') {
                    stopPlay();
                    renderFrame(Math.max(0, currentFrame - 1));
                } else if (e.code === 'ArrowRight') {
                    stopPlay();
                    renderFrame(Math.min(densityData.frames.length - 1, currentFrame + 1));
                }
            });
        }

        // 載入資料
        async function loadData() {
            try {
                const response = await fetch('ship_density_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                densityData = await response.json();

                // 設定時間軸範圍
                timelineEl.max = densityData.frames.length - 1;

                // 隱藏載入中
                loadingEl.style.display = 'none';

                // 繪製第一幀
                renderFrame(0);

                // 自動播放
                startPlay();

            } catch (error) {
                console.error('載入資料失敗:', error);
                loadingEl.querySelector('.loading-text').textContent =
                    '載入資料失敗，請確認 ship_density_data.json 檔案存在';
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            setupEventListeners();
            loadData();
        });
    </script>
</body>
</html>
