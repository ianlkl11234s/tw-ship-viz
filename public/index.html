<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣海域船舶密度熱區圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }

        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 頂部控制面板 */
        .control-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 16px;
            padding: 16px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            min-width: 400px;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            text-align: center;
        }

        .time-display {
            font-size: 24px;
            font-weight: 700;
            color: #4ecdc4;
            font-variant-numeric: tabular-nums;
        }

        .stats-row {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: #aaa;
        }

        .stats-row span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-value {
            color: #fff;
            font-weight: 600;
        }

        /* 播放控制 */
        .playback-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(78, 205, 196, 0.4);
        }

        .timeline-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timeline {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
        }

        .timeline::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4ecdc4;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(78, 205, 196, 0.5);
        }

        .speed-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .speed-btn:hover, .speed-btn.active {
            background: rgba(78, 205, 196, 0.2);
            border-color: #4ecdc4;
        }

        /* 圖例 */
        .legend {
            position: fixed;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .legend-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #fff;
        }

        .legend-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #ccc;
        }

        .legend-color {
            width: 24px;
            height: 16px;
            border-radius: 3px;
        }

        /* 載入中 */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(78, 205, 196, 0.2);
            border-top-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: #aaa;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 資訊面板 */
        .info-panel {
            position: fixed;
            bottom: 30px;
            left: 20px;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            font-size: 12px;
            color: #aaa;
            max-width: 200px;
        }

        .info-panel a {
            color: #4ecdc4;
            text-decoration: none;
        }

        .info-panel a:hover {
            text-decoration: underline;
        }

        /* 響應式設計 */
        @media (max-width: 600px) {
            .control-panel {
                min-width: auto;
                width: calc(100% - 40px);
                padding: 12px 16px;
            }

            .title {
                font-size: 14px;
            }

            .time-display {
                font-size: 18px;
            }

            .stats-row {
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
                font-size: 12px;
            }

            .legend {
                bottom: auto;
                top: auto;
                right: 10px;
                bottom: 120px;
                padding: 12px;
            }

            .info-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 載入中 -->
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">載入船舶密度資料中...</div>
    </div>

    <!-- 地圖 -->
    <div id="map"></div>

    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="title">🚢 台灣海域船舶密度熱區圖</div>
        <div class="time-display" id="timeDisplay">--</div>
        <div class="stats-row">
            <span>範圍內船舶：<span class="stats-value" id="shipCount">--</span></span>
            <span>最高密度：<span class="stats-value" id="maxDensity">--</span></span>
        </div>
        <div class="playback-controls">
            <button class="play-btn" id="playBtn">▶</button>
            <div class="timeline-container">
                <input type="range" class="timeline" id="timeline" min="0" max="100" value="0">
            </div>
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="2">2x</button>
            <button class="speed-btn" data-speed="4">4x</button>
        </div>
    </div>

    <!-- 圖例 -->
    <div class="legend">
        <div class="legend-title">船舶密度（艘/格）</div>
        <div class="legend-items">
            <div class="legend-item">
                <div class="legend-color" style="background: #e31a1c;"></div>
                <span>> 50</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #fd8d3c;"></div>
                <span>21 - 50</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #fecc5c;"></div>
                <span>11 - 20</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #2c7fb8;"></div>
                <span>6 - 10</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #41b6c4;"></div>
                <span>3 - 5</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #a1dab4;"></div>
                <span>1 - 2</span>
            </div>
        </div>
    </div>

    <!-- 資訊面板 -->
    <div class="info-panel">
        <p>資料來源：航港局 AIS</p>
        <p>格網解析度：0.05° (~5.5km)</p>
        <p style="margin-top: 8px;">
            <a href="https://github.com" target="_blank">GitHub</a>
        </p>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 全域變數
        let map;
        let densityData = null;
        let currentFrame = 0;
        let isPlaying = false;
        let playSpeed = 1;
        let playInterval = null;
        let gridLayer = null;
        let rectangles = [];

        // DOM 元素
        const loadingEl = document.getElementById('loading');
        const timeDisplayEl = document.getElementById('timeDisplay');
        const shipCountEl = document.getElementById('shipCount');
        const maxDensityEl = document.getElementById('maxDensity');
        const playBtnEl = document.getElementById('playBtn');
        const timelineEl = document.getElementById('timeline');
        const speedBtns = document.querySelectorAll('.speed-btn');

        // 色彩映射
        function getDensityColor(count) {
            if (count === 0) return null;
            if (count <= 2) return '#a1dab4';   // 淺綠
            if (count <= 5) return '#41b6c4';   // 青色
            if (count <= 10) return '#2c7fb8';  // 藍色
            if (count <= 20) return '#fecc5c';  // 黃色
            if (count <= 50) return '#fd8d3c';  // 橘色
            return '#e31a1c';                    // 紅色
        }

        function getDensityOpacity(count) {
            if (count === 0) return 0;
            if (count <= 2) return 0.5;
            if (count <= 5) return 0.6;
            if (count <= 10) return 0.7;
            if (count <= 20) return 0.75;
            if (count <= 50) return 0.8;
            return 0.85;
        }

        // 初始化地圖
        function initMap() {
            map = L.map('map', {
                center: [24.5, 121.5],
                zoom: 7,
                minZoom: 5,
                maxZoom: 12,
                zoomControl: true
            });

            // 深色底圖
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // 建立格網圖層
            gridLayer = L.layerGroup().addTo(map);
        }

        // 解壓縮格網資料
        function decompressRow(compressedRow) {
            const row = [];
            for (const item of compressedRow) {
                if (Array.isArray(item)) {
                    // RLE 編碼：[count, value]
                    const [count, value] = item;
                    for (let i = 0; i < count; i++) {
                        row.push(value);
                    }
                } else {
                    // 直接值
                    row.push(item);
                }
            }
            return row;
        }

        // 繪製密度格網
        function renderFrame(frameIndex) {
            if (!densityData || frameIndex < 0 || frameIndex >= densityData.frames.length) {
                return;
            }

            const frame = densityData.frames[frameIndex];
            const geoInfo = densityData.metadata.geo_info;

            // 更新 UI
            timeDisplayEl.textContent = frame.time;
            shipCountEl.textContent = frame.stats.ships_in_range.toLocaleString();
            maxDensityEl.textContent = frame.stats.max_density;
            timelineEl.value = frameIndex;

            // 清除現有格網
            gridLayer.clearLayers();

            // 繪製新格網
            const resolution = geoInfo.resolution_lon;

            for (let row = 0; row < frame.data.length; row++) {
                const decompressedRow = decompressRow(frame.data[row]);

                for (let col = 0; col < decompressedRow.length; col++) {
                    const count = decompressedRow[col];
                    if (count === 0) continue;

                    const lat1 = geoInfo.bottom_left_lat + row * resolution;
                    const lat2 = lat1 + resolution;
                    const lon1 = geoInfo.bottom_left_lon + col * resolution;
                    const lon2 = lon1 + resolution;

                    const color = getDensityColor(count);
                    const opacity = getDensityOpacity(count);

                    const rect = L.rectangle(
                        [[lat1, lon1], [lat2, lon2]],
                        {
                            color: color,
                            weight: 0,
                            fillColor: color,
                            fillOpacity: opacity
                        }
                    );

                    rect.bindPopup(`
                        <strong>船舶數量：${count}</strong><br>
                        經度：${lon1.toFixed(2)}° - ${lon2.toFixed(2)}°<br>
                        緯度：${lat1.toFixed(2)}° - ${lat2.toFixed(2)}°
                    `);

                    gridLayer.addLayer(rect);
                }
            }

            currentFrame = frameIndex;
        }

        // 播放控制
        function togglePlay() {
            if (isPlaying) {
                stopPlay();
            } else {
                startPlay();
            }
        }

        function startPlay() {
            isPlaying = true;
            playBtnEl.textContent = '⏸';

            const interval = 1000 / playSpeed;
            playInterval = setInterval(() => {
                let nextFrame = currentFrame + 1;
                if (nextFrame >= densityData.frames.length) {
                    nextFrame = 0;
                }
                renderFrame(nextFrame);
            }, interval);
        }

        function stopPlay() {
            isPlaying = false;
            playBtnEl.textContent = '▶';
            if (playInterval) {
                clearInterval(playInterval);
                playInterval = null;
            }
        }

        function setSpeed(speed) {
            playSpeed = speed;
            speedBtns.forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.speed) === speed);
            });

            if (isPlaying) {
                stopPlay();
                startPlay();
            }
        }

        // 事件綁定
        function setupEventListeners() {
            playBtnEl.addEventListener('click', togglePlay);

            timelineEl.addEventListener('input', (e) => {
                const frameIndex = parseInt(e.target.value);
                renderFrame(frameIndex);
            });

            speedBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    setSpeed(parseInt(btn.dataset.speed));
                });
            });

            // 鍵盤控制
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                } else if (e.code === 'ArrowLeft') {
                    stopPlay();
                    renderFrame(Math.max(0, currentFrame - 1));
                } else if (e.code === 'ArrowRight') {
                    stopPlay();
                    renderFrame(Math.min(densityData.frames.length - 1, currentFrame + 1));
                }
            });
        }

        // 載入資料
        async function loadData() {
            try {
                const response = await fetch('ship_density_data.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                densityData = await response.json();

                // 設定時間軸範圍
                timelineEl.max = densityData.frames.length - 1;

                // 隱藏載入中
                loadingEl.style.display = 'none';

                // 繪製第一幀
                renderFrame(0);

                // 自動播放
                startPlay();

            } catch (error) {
                console.error('載入資料失敗:', error);
                loadingEl.querySelector('.loading-text').textContent =
                    '載入資料失敗，請確認 ship_density_data.json 檔案存在';
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            setupEventListeners();
            loadData();
        });
    </script>
</body>
</html>
